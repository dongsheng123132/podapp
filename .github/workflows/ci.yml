name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/podapp-dock/pnpm-lock.yaml

      - name: Test runtime
        run: cargo test --workspace

      - name: Install dock dependencies
        working-directory: apps/podapp-dock
        run: pnpm install --frozen-lockfile

      - name: Build dock frontend
        working-directory: apps/podapp-dock
        run: pnpm build

      - name: Test dock backend
        working-directory: apps/podapp-dock/src-tauri
        run: cargo test

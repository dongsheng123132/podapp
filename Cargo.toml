[workspace]
resolver = "2"
members = ["crates/podapp-runtime", "crates/podapp-win", "crates/podapp-qr", "crates/podapp-mcp", "crates/podapp-codex", "crates/podapp-zip", "crates/podapp-cli", "crates/podapp-flow"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/dongsheng123132/podapp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 纯 Rust 后端：不引 C 工具链，客户机上不依赖 System32\tar.exe 也不依赖 PowerShell。
# 这条约束是从 U-King 的装机 issue 里换来的，别换成默认 backend。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"

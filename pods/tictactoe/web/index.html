<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>跟 AI 下井字棋</title>
<style>
  /* float 容器是无边框透明窗。忘了让 html/body 透明的话，
     圆角外面会是一块白，看起来像 transparent 没生效。 */
  html, body { margin: 0; height: 100%; background: transparent; }
  * { box-sizing: border-box; }

  .card {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 8px;
    padding: 10px;
    border-radius: 16px;
    border: 1px solid #2b3338;
    background: rgba(20, 23, 26, .94);
    color: #edf1f2;
    font: 12px/1.5 "Microsoft YaHei UI", system-ui, sans-serif;
    user-select: none;
  }

  /* 整条标题栏可拖 —— float 窗没有系统标题栏 */
  .bar { display: flex; align-items: center; gap: 6px; cursor: move; }
  .bar b { font-size: 12px; font-weight: 650; }
  .bar .x {
    margin-left: auto; width: 20px; height: 20px; padding: 0;
    border: 1px solid #2b3338; border-radius: 5px;
    background: #1b2024; color: #92a0a5; font: inherit; cursor: pointer;
  }
  .bar .x:hover { color: #edf1f2; border-color: #27b58b; }

  .board { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 5px; }
  .cell {
    display: grid; place-items: center;
    border: 1px solid #2b3338; border-radius: 8px;
    background: #1b2024; color: #edf1f2;
    font: 600 22px/1 system-ui; cursor: pointer;
  }
  .cell:hover:not(.taken) { border-color: #27b58b; }
  .cell.taken { cursor: default; }
  .cell.x { color: #27b58b; }
  .cell.o { color: #6aa9ff; }
  /* 连成一线的三格高亮 —— 不然赢了也看不出赢在哪 */
  .cell.win { border-color: #56d39b; background: #17302a; }

  .foot { display: flex; align-items: center; gap: 6px; }
  .msg { flex: 1; min-width: 0; color: #92a0a5; font-size: 10px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg.bad { color: #ef7777; }
  .foot button {
    padding: 4px 9px; border: 1px solid #2b3338; border-radius: 5px;
    background: #1b2024; color: #edf1f2; font: inherit; cursor: pointer;
  }
  .foot button:hover { border-color: #27b58b; }
</style>
</head>
<body>
  <div class="card">
    <div class="bar" data-podapp-drag>
      <b>井字棋</b>
      <button class="x" id="close" title="关掉" aria-label="关掉">×</button>
    </div>
    <div class="board" id="board"></div>
    <div class="foot">
      <span class="msg" id="msg">读棋盘…</span>
      <button id="reset">新局</button>
    </div>
  </div>

<script type="module">
import { ACTION } from "./action-parity.generated.mjs";
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const boardEl = document.getElementById("board");
const msgEl = document.getElementById("msg");

// 九个格子只建一次，之后只改内容 —— 每次重建会把 :hover 状态弄丢，
// 表现是「鼠标停着但高亮闪一下没了」
const cells = Array.from({ length: 9 }, (_, i) => {
  const b = document.createElement("button");
  b.className = "cell";
  b.type = "button";
  b.onclick = () => move(i);
  boardEl.append(b);
  return b;
});

function winningLine(board) {
  return LINES.find(([a, b, c]) => board[a] && board[a] === board[b] && board[a] === board[c]);
}

function paint(s) {
  const line = s.board ? winningLine(s.board) : null;
  cells.forEach((el, i) => {
    const v = s.board?.[i] ?? null;
    el.textContent = v ?? "";
    el.className = "cell"
      + (v ? " taken " + v.toLowerCase() : "")
      + (line?.includes(i) ? " win" : "");
    // 已占的格子和结束后的棋盘都不该还能点 —— 能点但会被拒，
    // 用起来像"点了没反应"
    el.disabled = Boolean(v) || Boolean(s.over);
  });
  msgEl.textContent = s.message ?? "";
  msgEl.className = "msg" + (s.ok === false ? " bad" : "");
}

// 所有操作都走 pod.action —— 跟 Codex 走 MCP 调的是同一个动作。
// 界面这边**不算胜负、不判轮次**，那些只在 actions.mjs 里有一份。
const call = (id, input) => window.pod.action(id, input || {});

async function refresh() { paint(await call(ACTION.APP_TICTACTOE_GAME_STATE)); }
async function move(cell) { paint(await call(ACTION.APP_TICTACTOE_GAME_MOVE, { cell })); }

document.getElementById("reset").onclick = async () =>
  paint(await call(ACTION.APP_TICTACTOE_GAME_RESET));
document.getElementById("close").onclick = () => window.pod.win.close();

refresh();
// 轮询是因为对手可能是**另一个进程**（Codex 走 MCP 落子）。
// 1.2 秒够快到有反应，又不会让一个常驻小窗一直忙。
setInterval(refresh, 1200);
</script>
</body>
</html>

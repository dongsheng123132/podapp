<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>九宫格切图</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151716;
        --panel: #1b1e1c;
        --surface: #222624;
        --surface-2: #292d2a;
        --line: #363b37;
        --line-strong: #4c534e;
        --text: #f2f4f1;
        --muted: #a1a8a3;
        --faint: #747b76;
        --accent: #49bdd0;
        --accent-ink: #061518;
        --bad: #ff7979;
        --good: #69d59a;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      button, input { font: inherit; letter-spacing: 0; }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      }
      .appbar {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: #181b19;
      }
      .mark {
        width: 30px;
        height: 30px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        padding: 5px;
        border: 1px solid #347582;
        border-radius: 7px;
        background: #183038;
      }
      .mark i { border: 1px solid var(--accent); border-radius: 1px; background: rgba(73,189,208,.16); }
      .title strong { display: block; font-size: 15px; font-weight: 650; }
      .title span { display: block; color: var(--muted); font-size: 11px; }
      .spacer { flex: 1; }
      .file-meta {
        max-width: 320px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .button, .icon-btn {
        height: 32px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }
      .button { padding: 0 12px; font-size: 12px; }
      .button:hover, .icon-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
      .icon-btn { width: 32px; display: grid; place-items: center; padding: 0; font-size: 17px; }
      .workspace {
        height: calc(100vh - 56px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 310px;
      }
      .stage-area {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 42px minmax(0, 1fr);
        background: #101211;
      }
      .stage-toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 16px;
        border-bottom: 1px solid #292d2a;
        color: var(--muted);
        font-size: 11px;
      }
      .stage-toolbar strong { color: var(--text); font-weight: 600; }
      .canvas {
        min-height: 0;
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 26px;
        background-color: #111311;
        background-image:
          linear-gradient(#1d201e 1px, transparent 1px),
          linear-gradient(90deg, #1d201e 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .empty {
        width: min(470px, 82%);
        padding: 38px 22px;
        border: 1px dashed #414742;
        border-radius: 8px;
        background: #161917;
        text-align: center;
        cursor: pointer;
      }
      .empty-grid {
        width: 112px;
        height: 112px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin: 0 auto 18px;
      }
      .empty-grid i {
        border: 1px solid #3f494b;
        border-radius: 3px;
        background: #1f2829;
      }
      .empty-grid i:nth-child(2), .empty-grid i:nth-child(6), .empty-grid i:nth-child(8) {
        border-color: #347582;
        background: #1c363b;
      }
      .empty b { display: block; font-size: 14px; }
      .empty span { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }
      .image-wrap {
        position: relative;
        line-height: 0;
        box-shadow: 0 18px 50px rgba(0,0,0,.45);
      }
      #image {
        display: block;
        max-width: min(100%, 960px);
        max-height: calc(100vh - 145px);
        border-radius: 3px;
      }
      #gridOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .inspector {
        min-height: 0;
        overflow-y: auto;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      .section {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 11px;
      }
      .section-head b { font-size: 13px; font-weight: 650; }
      .section-head span { color: var(--faint); font-size: 11px; }
      .presets {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #151816;
      }
      .preset {
        height: 31px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
      }
      .preset.on { background: var(--surface-2); color: var(--text); }
      .split-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      label { display: block; color: var(--muted); font-size: 11px; }
      .number {
        width: 100%;
        height: 34px;
        margin-top: 5px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: 0;
        background: #141715;
        color: var(--text);
      }
      .number:focus { border-color: #388291; box-shadow: 0 0 0 2px #192f34; }
      .range-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 5px;
      }
      .range-head b { color: var(--text); font-size: 11px; font-weight: 500; }
      .range-head span { color: var(--muted); font-size: 11px; }
      .range-row { display: grid; grid-template-columns: minmax(0, 1fr) 66px; gap: 9px; align-items: center; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .hint { margin-top: 8px; color: var(--muted); font-size: 11px; }
      .estimate {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--line);
      }
      .metric { padding: 10px; background: #191c1a; }
      .metric span { display: block; color: var(--muted); font-size: 10px; }
      .metric b { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; }
      .run { padding: 16px; }
      .primary {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 7px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        cursor: pointer;
      }
      .primary:hover { background: #5cc9db; }
      .primary:disabled { background: #3c4240; color: #838985; cursor: default; }
      .check { display: flex; align-items: center; gap: 7px; cursor: pointer; }
      .check input { accent-color: #5cc9db; }
      /* 下载链横跨整行 —— 它和九个缩略图是并列的一件东西，不是第十张图 */
      .ziprow { grid-column: 1 / -1; padding-top: 4px; }
      .ziprow a { color: #5cc9db; font-size: 11px; text-decoration: none; }
      .ziprow a:hover { text-decoration: underline; }
      .status { min-height: 32px; padding-top: 9px; color: var(--muted); font-size: 11px; }
      .status.bad { color: var(--bad); }
      .status.good { color: var(--good); }
      .results {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 10px;
      }
      .tile {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: #111;
      }
      .tile img { width: 100%; height: 100%; object-fit: cover; }
      .tile span {
        position: absolute;
        right: 3px;
        bottom: 3px;
        min-width: 18px;
        padding: 1px 4px;
        border-radius: 3px;
        background: rgba(5,9,7,.78);
        color: #fff;
        font-size: 9px;
        line-height: 16px;
        text-align: center;
      }
      @media (max-width: 760px) {
        body { overflow: auto; }
        .workspace { height: auto; grid-template-columns: 1fr; }
        .stage-area { min-height: 560px; }
        .inspector { border-left: 0; border-top: 1px solid var(--line); }
        .file-meta { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <span class="mark" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
      <div class="title">
        <strong>九宫格切图</strong>
        <span>按原图像素精确切片，不压缩</span>
      </div>
      <span id="fileMeta" class="file-meta">尚未载入图片</span>
      <span class="spacer"></span>
      <button id="chooseBtn" class="button" type="button">选择图片</button>
      <button id="resetBtn" class="icon-btn" type="button" title="重新开始" disabled>↺</button>
      <input id="fileInput" type="file" accept="image/*" hidden />
    </header>

    <main class="workspace">
      <section class="stage-area">
        <div class="stage-toolbar">
          <strong>切片预览</strong>
          <span id="stageInfo">载入图片后显示精确分割线</span>
          <span style="margin-left:auto">蓝线为保留区域，深色缝隙会被丢弃</span>
        </div>
        <div id="canvas" class="canvas">
          <div id="empty" class="empty" role="button" tabindex="0">
            <div class="empty-grid" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <b>放入一张拼图</b>
            <span>拖放、选择文件或 Ctrl+V 粘贴</span>
          </div>
          <div id="imageWrap" class="image-wrap" hidden>
            <img id="image" alt="切片预览" />
            <svg id="gridOverlay"></svg>
          </div>
        </div>
      </section>

      <aside class="inspector">
        <section class="section">
          <div class="section-head"><b>切片布局</b><span id="layoutSummary">3 × 3</span></div>
          <div class="presets">
            <button class="preset on" data-rows="3" data-cols="3" type="button">3 × 3</button>
            <button class="preset" data-rows="2" data-cols="2" type="button">2 × 2</button>
            <button class="preset" data-rows="1" data-cols="3" type="button">1 × 3</button>
            <button class="preset" data-rows="3" data-cols="1" type="button">3 × 1</button>
          </div>
          <div class="split-inputs">
            <label>行数<input id="rows" class="number" type="number" min="1" max="12" value="3" /></label>
            <label>列数<input id="cols" class="number" type="number" min="1" max="12" value="3" /></label>
          </div>
        </section>

        <section class="section">
          <div class="range-head"><b>丢弃格子间隙</b><span id="gapLabel">0 px</span></div>
          <div class="range-row">
            <input id="gapRange" type="range" min="0" max="128" value="0" />
            <input id="gap" class="number" type="number" min="0" max="512" value="0" />
          </div>
          <div class="hint">AI 拼图自带白边时，增加数值直到预览线贴合每格内容。</div>
        </section>

        <section class="section">
          <label class="check"
            ><input id="zipPack" type="checkbox" /><b>同时打包成一个 zip</b></label
          >
          <div class="hint">切片照常一张张交付；打包只是额外多一件，方便一次拿走。</div>
        </section>

        <section class="section">
          <div class="section-head"><b>预计输出</b><span id="countSummary">9 张</span></div>
          <div class="estimate">
            <div class="metric"><span>单张约</span><b id="cellMetric">--</b></div>
            <div class="metric"><span>原图</span><b id="sourceMetric">--</b></div>
          </div>
        </section>

        <section class="run">
          <button id="splitBtn" class="primary" type="button" disabled>切成 9 张图片</button>
          <div id="status" class="status">请先载入图片。</div>
          <div id="results" class="results" hidden></div>
        </section>
      </aside>
    </main>

    <script type="module">
      import { ACTION } from "./action-parity.generated.mjs";
      import { tiles } from "./actions.mjs";

      const $ = (id) => document.getElementById(id);
      const state = { image: null, name: "", working: false };
      const clamp = (n, lo, hi, fallback) => Math.max(lo, Math.min(hi, Number.isFinite(+n) ? +n : fallback));
      const values = () => ({
        rows: Math.round(clamp($("rows").value, 1, 12, 3)),
        cols: Math.round(clamp($("cols").value, 1, 12, 3)),
        gap: Math.round(clamp($("gap").value, 0, 512, 0)),
        // 界面点的和 AI 无头调的是**同一个动作、同一个入参**。界面这边自己再拼一次
        // 打包逻辑，就等于把一个动作实现了两遍 —— 那正是这套东西要消灭的分叉。
        zip: $("zipPack").checked,
      });

      const readImage = (file) => new Promise((resolve, reject) => {
        if (!file?.type?.startsWith("image/")) return reject(new Error("请选择图片文件"));
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result));
        fr.onerror = () => reject(new Error("图片读取失败"));
        fr.readAsDataURL(file);
      });

      function setStatus(text, kind = "") {
        $("status").textContent = text;
        $("status").className = `status ${kind}`;
      }

      function syncPresets(rows, cols) {
        document.querySelectorAll(".preset").forEach((b) => {
          b.classList.toggle("on", +b.dataset.rows === rows && +b.dataset.cols === cols);
        });
      }

      function renderPreview() {
        const { rows, cols, gap } = values();
        $("rows").value = rows;
        $("cols").value = cols;
        $("gap").value = gap;
        $("gapRange").value = Math.min(gap, +$("gapRange").max);
        $("gapLabel").textContent = `${gap} px`;
        $("layoutSummary").textContent = `${rows} × ${cols}`;
        $("countSummary").textContent = `${rows * cols} 张`;
        $("splitBtn").textContent = `切成 ${rows * cols} 张图片`;
        syncPresets(rows, cols);

        const img = $("image");
        if (!state.image || !img.naturalWidth) {
          $("cellMetric").textContent = "--";
          $("sourceMetric").textContent = "--";
          return;
        }

        const plan = tiles(img.naturalWidth, img.naturalHeight, rows, cols, gap);
        const valid = plan.every((tile) => tile.w > 0 && tile.h > 0);
        $("sourceMetric").textContent = `${img.naturalWidth}×${img.naturalHeight}`;
        $("cellMetric").textContent = valid ? `${plan[0].w}×${plan[0].h}` : "参数无效";
        $("stageInfo").textContent = `${rows} 行 × ${cols} 列 · 间隙 ${gap}px · ${rows * cols} 张`;
        $("splitBtn").disabled = state.working || !valid;

        const stroke = Math.max(1.5, img.naturalWidth / 500);
        const overlay = $("gridOverlay");
        overlay.setAttribute("viewBox", `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
        overlay.innerHTML = valid
          ? plan.map((tile, index) => `
              <rect x="${tile.x}" y="${tile.y}" width="${tile.w}" height="${tile.h}"
                    fill="rgba(73,189,208,.035)" stroke="#49bdd0" stroke-width="${stroke}"/>
              <text x="${tile.x + stroke * 5}" y="${tile.y + stroke * 14}"
                    fill="#dffaff" font-size="${stroke * 10}" font-weight="700"
                    paint-order="stroke" stroke="rgba(5,15,17,.75)" stroke-width="${stroke * 2}">${index + 1}</text>
            `).join("")
          : "";
        if (!valid) setStatus("当前间隙会把格子切空，请减小间隙。", "bad");
        else if (!state.working) setStatus("预览已按原图像素计算，可以开始切图。");
      }

      async function loadFile(file) {
        try {
          const url = await readImage(file);
          const img = $("image");
          img.onload = () => {
            state.image = url;
            state.name = file.name || "粘贴的图片";
            $("fileMeta").textContent = `${state.name} · ${img.naturalWidth}×${img.naturalHeight}`;
            $("empty").hidden = true;
            $("imageWrap").hidden = false;
            $("resetBtn").disabled = false;
            $("results").hidden = true;
            renderPreview();
          };
          img.src = url;
        } catch (e) {
          setStatus(String(e.message || e), "bad");
        }
      }

      function reset() {
        state.image = null;
        state.name = "";
        $("image").removeAttribute("src");
        $("empty").hidden = false;
        $("imageWrap").hidden = true;
        $("resetBtn").disabled = true;
        $("splitBtn").disabled = true;
        $("fileMeta").textContent = "尚未载入图片";
        $("stageInfo").textContent = "载入图片后显示精确分割线";
        $("results").hidden = true;
        setStatus("请先载入图片。");
        renderPreview();
      }

      document.querySelectorAll(".preset").forEach((button) => {
        button.onclick = () => {
          $("rows").value = button.dataset.rows;
          $("cols").value = button.dataset.cols;
          renderPreview();
        };
      });
      ["rows", "cols", "gap"].forEach((id) => $(id).addEventListener("input", renderPreview));
      $("gapRange").addEventListener("input", (e) => {
        $("gap").value = e.target.value;
        renderPreview();
      });
      $("chooseBtn").onclick = () => $("fileInput").click();
      $("empty").onclick = () => $("fileInput").click();
      $("fileInput").onchange = (e) => e.target.files[0] && loadFile(e.target.files[0]);
      $("resetBtn").onclick = reset;

      document.addEventListener("dragover", (e) => e.preventDefault());
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        const file = e.dataTransfer?.files?.[0];
        if (file) loadFile(file);
      });
      document.addEventListener("paste", (e) => {
        const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith("image/"));
        const file = item?.getAsFile();
        if (file) loadFile(file);
      });

      $("splitBtn").onclick = async () => {
        state.working = true;
        $("splitBtn").disabled = true;
        $("results").hidden = true;
        setStatus("正在按原图像素切片…");
        try {
          const result = await pod.action(ACTION.APP_NINE_GRID_IMAGE_SPLIT, {
            image: state.image,
            ...values(),
          });
          $("results").replaceChildren(...result.tiles.map((tile) => {
            const item = document.createElement("div");
            item.className = "tile";
            item.title = `第 ${tile.row} 行第 ${tile.col} 列 · ${tile.w}×${tile.h}`;
            const img = new Image();
            img.alt = `${tile.row}-${tile.col}`;
            img.src = `/artifact/${encodeURIComponent(tile.artifact.id)}`;
            const label = document.createElement("span");
            label.textContent = `${tile.row}-${tile.col}`;
            item.append(img, label);
            return item;
          }));
          if (result.zip) {
            // 直接给一条能点的下载链，别只说「已进收件箱」——
            // 用户要的是拿到文件，不是知道它在某个列表里。
            const row = document.createElement("div");
            row.className = "ziprow";
            const a = document.createElement("a");
            a.href = `/artifact/${encodeURIComponent(result.zip.id)}`;
            a.setAttribute("download", `九宫格-${values().rows}x${values().cols}.zip`);
            a.textContent = `下载 zip（${Math.max(1, Math.round(result.zip.bytes / 1024))} KB）`;
            row.append(a);
            $("results").append(row);
          }
          $("results").hidden = false;
          setStatus(`${result.message}，结果已进入收件箱。`, "good");
        } catch (e) {
          setStatus(String(e.message || e), "bad");
        }
        state.working = false;
        renderPreview();
      };

      renderPreview();
    </script>
  </body>
</html>

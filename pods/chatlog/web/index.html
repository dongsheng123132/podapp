<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" /><title>对话导出</title>
    <style>
      :root{--bg:#14161a;--fg:#e6e8ec;--dim:#8b93a1;--line:#262a31;--ac:#38bdf8;--bad:#fca5a5}
      *{box-sizing:border-box}
      body{margin:0;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;
           font:14px/1.6 "Microsoft YaHei UI",system-ui,sans-serif}
      header{padding:12px 18px;border-bottom:1px solid var(--line);font-weight:600}
      main{flex:1;display:flex;min-height:0}
      #list{flex:1;overflow-y:auto;padding:8px}
      .s{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
      .s:hover{background:#1b1f26}
      .s.on{border-color:var(--ac);background:#12222c}
      .t{font-weight:500}
      .m{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      aside{width:280px;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
      button{background:var(--ac);color:#06222e;border:0;border-radius:8px;padding:10px;font-weight:600;cursor:pointer}
      button:disabled{background:#3a3f4a;color:var(--dim);cursor:not-allowed}
      button.g{background:none;border:1px solid var(--line);color:var(--dim);font-weight:400}
      .hint{font-size:12px;color:var(--dim)} .bad{color:var(--bad)}
      label{font-size:12px;color:var(--dim)}
      #drop{margin:8px;padding:14px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--dim);font-size:12px}
    </style>
  </head>
  <body>
    <header>对话导出 —— 系统提示词不会被导出去</header>
    <main>
      <section style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div id="drop">读不到 Codex？把 rollout-*.jsonl 拖进来也行</div>
        <div id="list"></div>
      </section>
      <aside>
        <div><label>格式</label>
          <select id="fmt" style="width:100%;background:#0f1115;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px">
            <option value="markdown">Markdown</option><option value="html">HTML（单文件）</option>
          </select>
        </div>
        <button id="go" disabled>导出选中的</button>
        <button id="rl" class="g">刷新列表</button>
        <div id="msg" class="hint"></div>
      </aside>
    </main>
    <script type="module">
      const $=(i)=>document.getElementById(i);
      const [list,go,rl,msg,fmt,drop]=["list","go","rl","msg","fmt","drop"].map($);
      let sel=null, jsonl=null;

      async function load(){
        msg.className="hint"; msg.textContent="读取中…";
        try{
          const r=await pod.action("app.chatlog.session.list",{limit:80});
          list.replaceChildren(...r.sessions.map((s)=>{
            const d=document.createElement("div"); d.className="s";
            const t=document.createElement("div"); t.className="t"; t.textContent=s.title;
            const m=document.createElement("div"); m.className="m";
            m.textContent=`${(s.started||"").slice(0,16).replace("T"," ")} · ${s.turns} 条 · ${s.cwd}`;
            d.append(t,m);
            d.onclick=()=>{ sel=s.id; jsonl=null;
              [...list.children].forEach((c)=>c.classList.remove("on")); d.classList.add("on");
              go.disabled=false; };
            return d;
          }));
          msg.textContent=r.message;
        }catch(e){ msg.className="hint bad"; msg.textContent=String(e.message||e); }
      }
      rl.onclick=load;

      // 兜底：Codex 目录读不到（没装 / 版本变了）时，直接拖文件进来
      document.addEventListener("dragover",(e)=>e.preventDefault());
      document.addEventListener("drop",(e)=>{
        e.preventDefault();
        const f=e.dataTransfer?.files?.[0]; if(!f) return;
        const fr=new FileReader();
        fr.onload=()=>{ jsonl=String(fr.result); sel=null; go.disabled=false;
          drop.textContent=`已载入 ${f.name}`; };
        fr.readAsText(f);
      });

      go.onclick=async()=>{
        go.disabled=true; msg.className="hint"; msg.textContent="导出中…";
        try{
          const r=await pod.action("app.chatlog.session.export",
            jsonl?{jsonl,format:fmt.value}:{session:sel,format:fmt.value});
          msg.textContent=r.message+"（已进收件箱）";
        }catch(e){ msg.className="hint bad"; msg.textContent=String(e.message||e); }
        go.disabled=false;
      };
      load();
    </script>
  </body>
</html>

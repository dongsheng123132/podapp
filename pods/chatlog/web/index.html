<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>对话导出</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #151716;
        --panel: #1b1e1c;
        --surface: #222624;
        --surface-2: #292d2a;
        --line: #363b37;
        --line-strong: #4d544f;
        --text: #f2f4f1;
        --muted: #a1a8a3;
        --faint: #747b76;
        --accent: #73c6a7;
        --accent-ink: #06130e;
        --bad: #ff7979;
        --good: #6bd69d;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      button, input { font: inherit; letter-spacing: 0; }
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
      }
      .appbar {
        height: 56px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
        background: #181b19;
      }
      .mark {
        width: 30px;
        height: 30px;
        position: relative;
        border: 1px solid #477d68;
        border-radius: 7px;
        background: #1c342b;
      }
      .mark::before {
        content: "";
        position: absolute;
        left: 7px;
        right: 7px;
        top: 8px;
        height: 2px;
        background: var(--accent);
        box-shadow: 0 5px 0 var(--accent), 0 10px 0 #477d68;
      }
      .title strong { display: block; font-size: 15px; font-weight: 650; }
      .title span { display: block; color: var(--muted); font-size: 11px; }
      .spacer { flex: 1; }
      .search-wrap {
        width: min(290px, 32vw);
        position: relative;
      }
      .search-wrap::before {
        content: "";
        position: absolute;
        left: 11px;
        top: 10px;
        width: 8px;
        height: 8px;
        border: 1.5px solid var(--muted);
        border-radius: 50%;
      }
      .search-wrap::after {
        content: "";
        position: absolute;
        left: 19px;
        top: 19px;
        width: 5px;
        height: 1.5px;
        background: var(--muted);
        transform: rotate(45deg);
      }
      #search {
        width: 100%;
        height: 34px;
        padding: 0 10px 0 31px;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: 0;
        background: #141715;
        color: var(--text);
        font-size: 12px;
      }
      #search:focus { border-color: #477d68; box-shadow: 0 0 0 2px #1b3028; }
      .icon-btn {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font-size: 17px;
      }
      .icon-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
      .workspace {
        height: calc(100vh - 56px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
      }
      .library {
        min-width: 0;
        min-height: 0;
        display: grid;
        grid-template-rows: 42px minmax(0, 1fr);
        background: #171a18;
      }
      .library-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 11px;
      }
      .library-head strong { color: var(--text); font-weight: 600; }
      .library-head .count {
        min-width: 20px;
        height: 19px;
        padding: 0 5px;
        border-radius: 10px;
        background: var(--surface-2);
        color: var(--muted);
        line-height: 19px;
        text-align: center;
      }
      .session-list { min-height: 0; overflow-y: auto; padding: 6px 0 18px; }
      .group-label {
        padding: 12px 16px 5px;
        color: var(--faint);
        font-size: 10px;
        font-weight: 650;
      }
      .session {
        width: 100%;
        min-height: 64px;
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 9px 16px;
        border: 0;
        border-left: 3px solid transparent;
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }
      .session:hover { background: #1d211e; }
      .session.on { border-left-color: var(--accent); background: #1d2924; }
      .session-icon {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
      }
      .session.on .session-icon { border-color: #477d68; color: var(--accent); background: #1a342a; }
      .session-copy { min-width: 0; }
      .session-title {
        display: block;
        overflow: hidden;
        color: var(--text);
        font-size: 12px;
        font-weight: 550;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .session-meta {
        display: block;
        margin-top: 4px;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .session-turns { color: var(--faint); font-size: 10px; white-space: nowrap; }
      .empty-list {
        display: grid;
        place-items: center;
        min-height: 260px;
        padding: 30px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .inspector {
        min-height: 0;
        overflow-y: auto;
        border-left: 1px solid var(--line);
        background: var(--panel);
      }
      .section {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .section-title b { font-size: 13px; font-weight: 650; }
      .section-title span { color: var(--faint); font-size: 10px; }
      .selected-title { font-size: 13px; font-weight: 600; line-height: 1.45; }
      .selected-meta {
        display: grid;
        gap: 7px;
        margin-top: 11px;
        color: var(--muted);
        font-size: 10px;
      }
      .meta-row { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 8px; }
      .meta-row span:last-child { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .format-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #151816;
      }
      .format {
        height: 32px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 11px;
      }
      .format.on { background: var(--surface-2); color: var(--text); }
      label { display: block; margin-top: 12px; color: var(--muted); font-size: 11px; }
      .text-input {
        width: 100%;
        height: 36px;
        margin-top: 5px;
        padding: 0 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: 0;
        background: #141715;
        color: var(--text);
        font-size: 12px;
      }
      .text-input:focus { border-color: #477d68; box-shadow: 0 0 0 2px #1b3028; }
      .privacy {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 10px;
      }
      .privacy::before {
        content: "✓";
        width: 17px;
        height: 17px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #20402f;
        color: var(--good);
        line-height: 17px;
        text-align: center;
      }
      .import {
        padding: 12px;
        border: 1px dashed var(--line-strong);
        border-radius: 7px;
        background: #191c1a;
        cursor: pointer;
        text-align: center;
      }
      .import:hover, .import.over { border-color: var(--accent); background: #1b2521; }
      .import b { display: block; font-size: 11px; font-weight: 600; }
      .import span {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .run { padding: 16px; }
      .primary {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 7px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        cursor: pointer;
      }
      .primary:hover { background: #84d0b4; }
      .primary:disabled { background: #3d423f; color: #858b87; cursor: default; }
      .status { min-height: 34px; padding-top: 9px; color: var(--muted); font-size: 11px; }
      .status.good { color: var(--good); }
      .status.bad { color: var(--bad); }
      .result {
        margin-top: 8px;
        padding: 11px;
        border: 1px solid #315b49;
        border-radius: 7px;
        background: #1a2a23;
      }
      .result b { display: block; color: var(--good); font-size: 12px; }
      .result span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
      .result code {
        display: block;
        margin-top: 7px;
        overflow: hidden;
        color: #bdd5ca;
        font: 9px/1.4 "Cascadia Mono", Consolas, monospace;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      @media (max-width: 760px) {
        body { overflow: auto; }
        .workspace { height: auto; grid-template-columns: 1fr; }
        .library { min-height: 580px; }
        .inspector { border-left: 0; border-top: 1px solid var(--line); }
        .search-wrap { width: min(210px, 40vw); }
        .title span { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <span class="mark" aria-hidden="true"></span>
      <div class="title">
        <strong>对话导出</strong>
        <span>整理 Codex 会话，生成可交付文档</span>
      </div>
      <span class="spacer"></span>
      <div class="search-wrap"><input id="search" type="search" placeholder="搜索标题或工作目录" /></div>
      <button id="refreshBtn" class="icon-btn" type="button" title="刷新会话列表">↻</button>
    </header>

    <main class="workspace">
      <section class="library">
        <div class="library-head">
          <strong>最近会话</strong>
          <span id="sessionCount" class="count">0</span>
          <span id="listStatus">正在读取本机 Codex 会话</span>
        </div>
        <div id="sessionList" class="session-list"></div>
      </section>

      <aside class="inspector">
        <section class="section">
          <div class="section-title"><b>当前选择</b><span id="selectionType">未选择</span></div>
          <div id="selectedTitle" class="selected-title">从左侧选择一次会话</div>
          <div id="selectedMeta" class="selected-meta">
            <div class="meta-row"><span>时间</span><span>--</span></div>
            <div class="meta-row"><span>消息</span><span>--</span></div>
            <div class="meta-row"><span>目录</span><span>--</span></div>
          </div>
        </section>

        <section class="section">
          <div class="section-title"><b>导出设置</b><span id="formatHint">适合仓库与文档</span></div>
          <div class="format-tabs">
            <button class="format on" data-format="markdown" type="button">Markdown</button>
            <button class="format" data-format="html" type="button">HTML 单文件</button>
          </div>
          <label for="customTitle">文档标题
            <input id="customTitle" class="text-input" type="text" maxlength="200" placeholder="默认使用会话首条问题" />
          </label>
          <div class="privacy">只导出用户与 Codex 的对话，developer / system 提示词会被自动排除。</div>
        </section>

        <section class="section">
          <div class="section-title"><b>导入本地记录</b><span>备用入口</span></div>
          <div id="importDrop" class="import" role="button" tabindex="0">
            <b>拖入 rollout-*.jsonl</b>
            <span id="importName">Codex 列表读不到时，也能直接导出</span>
          </div>
          <input id="jsonlFile" type="file" accept=".jsonl,.txt,application/json,text/plain" hidden />
        </section>

        <section class="run">
          <button id="exportBtn" class="primary" type="button" disabled>导出当前会话</button>
          <div id="status" class="status">请选择一次会话或导入 JSONL。</div>
          <div id="result" class="result" hidden>
            <b id="resultTitle">导出完成</b>
            <span id="resultMeta"></span>
            <code id="resultPath"></code>
          </div>
        </section>
      </aside>
    </main>

    <script type="module">
      import { ACTION } from "./action-parity.generated.mjs";
      const $ = (id) => document.getElementById(id);
      const state = {
        sessions: [],
        selected: null,
        jsonl: null,
        jsonlName: "",
        format: "markdown",
        loading: false,
        working: false,
      };

      const cleanDate = (value) => {
        const d = new Date(value || "");
        return Number.isNaN(d.getTime()) ? "时间未知" : d.toLocaleString("zh-CN", {
          month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit",
          hour12: false,
        });
      };
      const dayLabel = (value) => {
        const d = new Date(value || "");
        if (Number.isNaN(d.getTime())) return "更早";
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);
        const key = d.toDateString();
        if (key === today.toDateString()) return "今天";
        if (key === yesterday.toDateString()) return "昨天";
        return d.toLocaleDateString("zh-CN", { month: "long", day: "numeric" });
      };

      function setStatus(text, kind = "") {
        $("status").textContent = text;
        $("status").className = `status ${kind}`;
      }

      function updateSelection() {
        const session = state.selected;
        if (state.jsonl) {
          $("selectionType").textContent = "本地 JSONL";
          $("selectedTitle").textContent = state.jsonlName;
          $("selectedMeta").innerHTML = `
            <div class="meta-row"><span>来源</span><span>手动导入</span></div>
            <div class="meta-row"><span>大小</span><span>${Math.max(1, Math.round(state.jsonl.length / 1024))} KB</span></div>
            <div class="meta-row"><span>过滤</span><span>系统提示词不导出</span></div>
          `;
          $("exportBtn").textContent = `导出 ${state.format === "html" ? "HTML" : "Markdown"}`;
        } else if (session) {
          $("selectionType").textContent = "Codex 会话";
          $("selectedTitle").textContent = session.title || "未命名会话";
          $("selectedMeta").innerHTML = `
            <div class="meta-row"><span>时间</span><span>${cleanDate(session.started)}</span></div>
            <div class="meta-row"><span>消息</span><span>${session.turns ?? 0} 条</span></div>
            <div class="meta-row"><span>目录</span><span title="${session.cwd || ""}">${session.cwd || "未知"}</span></div>
          `;
          $("exportBtn").textContent = `导出 ${state.format === "html" ? "HTML" : "Markdown"}`;
        } else {
          $("selectionType").textContent = "未选择";
          $("selectedTitle").textContent = "从左侧选择一次会话";
          $("selectedMeta").innerHTML = `
            <div class="meta-row"><span>时间</span><span>--</span></div>
            <div class="meta-row"><span>消息</span><span>--</span></div>
            <div class="meta-row"><span>目录</span><span>--</span></div>
          `;
          $("exportBtn").textContent = "导出当前会话";
        }
        $("exportBtn").disabled = state.working || (!state.selected && !state.jsonl);
      }

      function selectSession(session) {
        state.selected = session;
        state.jsonl = null;
        state.jsonlName = "";
        $("importName").textContent = "Codex 列表读不到时，也能直接导出";
        $("result").hidden = true;
        updateSelection();
        renderSessions();
      }

      function renderSessions() {
        const query = $("search").value.trim().toLowerCase();
        const filtered = state.sessions.filter((session) =>
          `${session.title || ""} ${session.cwd || ""}`.toLowerCase().includes(query),
        );
        $("sessionCount").textContent = filtered.length;
        $("listStatus").textContent = query ? `匹配 ${filtered.length} 次会话` : `共 ${state.sessions.length} 次会话`;
        if (!filtered.length) {
          $("sessionList").innerHTML = `<div class="empty-list">${query ? "没有匹配的会话" : "没有找到可导出的 Codex 会话"}</div>`;
          return;
        }
        const nodes = [];
        let currentGroup = "";
        for (const session of filtered) {
          const group = dayLabel(session.started);
          if (group !== currentGroup) {
            const label = document.createElement("div");
            label.className = "group-label";
            label.textContent = group;
            nodes.push(label);
            currentGroup = group;
          }
          const button = document.createElement("button");
          button.className = `session ${state.selected?.id === session.id && !state.jsonl ? "on" : ""}`;
          button.type = "button";
          const icon = document.createElement("span");
          icon.className = "session-icon";
          icon.textContent = "CX";
          const copy = document.createElement("span");
          copy.className = "session-copy";
          const title = document.createElement("span");
          title.className = "session-title";
          title.textContent = session.title || "未命名会话";
          const meta = document.createElement("span");
          meta.className = "session-meta";
          meta.textContent = `${cleanDate(session.started)} · ${session.cwd || "未知目录"}`;
          const turns = document.createElement("span");
          turns.className = "session-turns";
          turns.textContent = `${session.turns ?? 0} 条`;
          copy.append(title, meta);
          button.append(icon, copy, turns);
          button.onclick = () => selectSession(session);
          nodes.push(button);
        }
        $("sessionList").replaceChildren(...nodes);
      }

      async function loadSessions() {
        state.loading = true;
        $("listStatus").textContent = "正在读取…";
        $("refreshBtn").disabled = true;
        try {
          const result = await pod.action(ACTION.APP_CHATLOG_SESSION_LIST, { limit: 120 });
          state.sessions = result.sessions || [];
          renderSessions();
          if (!state.selected && !state.jsonl && state.sessions[0]) selectSession(state.sessions[0]);
          setStatus(state.sessions.length ? "已选择最近一次会话，可直接导出。" : "没有找到会话，可拖入 rollout JSONL。");
        } catch (e) {
          state.sessions = [];
          renderSessions();
          setStatus(`${String(e.message || e)}；仍可拖入 rollout JSONL。`, "bad");
        }
        state.loading = false;
        $("refreshBtn").disabled = false;
      }

      async function importJsonl(file) {
        try {
          const text = await file.text();
          if (!text.trim()) throw new Error("这个文件是空的");
          state.jsonl = text;
          state.jsonlName = file.name || "rollout.jsonl";
          state.selected = null;
          $("importName").textContent = `${state.jsonlName} · ${Math.max(1, Math.round(text.length / 1024))} KB`;
          $("result").hidden = true;
          renderSessions();
          updateSelection();
          setStatus("本地会话记录已载入，可以导出。");
        } catch (e) {
          setStatus(String(e.message || e), "bad");
        }
      }

      $("search").addEventListener("input", renderSessions);
      $("refreshBtn").onclick = loadSessions;
      document.querySelectorAll(".format").forEach((button) => {
        button.onclick = () => {
          state.format = button.dataset.format;
          document.querySelectorAll(".format").forEach((b) => b.classList.toggle("on", b === button));
          $("formatHint").textContent = state.format === "html" ? "适合直接发送和离线打开" : "适合仓库、文档与继续交给 AI";
          updateSelection();
        };
      });
      $("importDrop").onclick = () => $("jsonlFile").click();
      $("jsonlFile").onchange = (e) => e.target.files[0] && importJsonl(e.target.files[0]);
      document.addEventListener("dragover", (e) => {
        e.preventDefault();
        $("importDrop").classList.add("over");
      });
      document.addEventListener("dragleave", (e) => {
        if (!e.relatedTarget) $("importDrop").classList.remove("over");
      });
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        $("importDrop").classList.remove("over");
        const file = e.dataTransfer?.files?.[0];
        if (file) importJsonl(file);
      });

      $("exportBtn").onclick = async () => {
        state.working = true;
        updateSelection();
        $("result").hidden = true;
        setStatus("正在整理消息并生成文档…");
        try {
          const input = {
            format: state.format,
            ...($("customTitle").value.trim() ? { title: $("customTitle").value.trim() } : {}),
            ...(state.jsonl ? { jsonl: state.jsonl } : { session: state.selected.id }),
          };
          const result = await pod.action(ACTION.APP_CHATLOG_SESSION_EXPORT, input);
          $("resultTitle").textContent = `「${result.title}」导出完成`;
          $("resultMeta").textContent = `${result.count} 条消息 · ${result.format.toUpperCase()} · ${Math.max(1, Math.round(result.bytes / 1024))} KB`;
          $("resultPath").textContent = result.artifact.path || result.artifact.id;
          $("result").hidden = false;
          setStatus(`${result.message}，文件已进入收件箱。`, "good");
        } catch (e) {
          setStatus(String(e.message || e), "bad");
        }
        state.working = false;
        updateSelection();
      };

      updateSelection();
      loadSessions();
    </script>
  </body>
</html>

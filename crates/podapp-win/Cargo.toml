[package]
name = "podapp-win"
version = "0.1.0"
description = "找到宿主 AI 应用的窗口并跟随它 —— 浮舱吸附靠这个"
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }

# 只有 tests/follow.rs 造测试窗口时才需要 WNDCLASSW/RegisterClassW（它们被 Gdi feature 门住）。
# 放在 dev-dependencies 里，免得把 Gdi 拖进正式产物 —— 浮舱本身不画 GDI。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi"] }

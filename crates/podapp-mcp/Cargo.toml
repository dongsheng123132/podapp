[package]
name = "podapp-mcp"
version = "0.1.0"
description = "把已装程序舱的动作暴露成 MCP 工具 —— 装一个 Pod，任何 MCP 客户端都能调"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "podapp_mcp"
path = "src/lib.rs"

[[bin]]
name = "podapp-mcp"
path = "src/main.rs"

[dependencies]
podapp-runtime = { path = "../podapp-runtime" }
# 能力与宿主动作的唯一组装处 —— MCP 这条路要和浮舱看到同一批动词。
# 直接依赖某个能力 crate（原来是 podapp-qr）就是漂移的起点：
# 加能力的人只会去改浮舱，不会想到 MCP 这边还有一份。
podapp-host = { path = "../podapp-host" }
serde_json.workspace = true

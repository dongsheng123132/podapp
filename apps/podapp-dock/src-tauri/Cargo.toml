[package]
name = "podapp-dock"
version = "0.1.1"
description = "PodApp 浮舱 —— 贴在 AI 工作界面旁边的确定性动作舱"
edition = "2021"
license = "Apache-2.0"

# 刻意**不**进上层 workspace：Tauri 的 build.rs 要求 frontendDist 目录存在，
# 而那个目录是 vite 产物、进了 .gitignore。放进 workspace 会让根目录的
# `cargo test`（纯 Rust、几秒钟）变成「必须先装 npm 依赖并跑一次前端构建」。
[workspace]

[lib]
name = "podapp_dock_lib"
# 只要 rlib。staticlib/cdylib 是给移动端用的，桌面用不上 —— 而它们跟
# `panic = "abort"` 一起会让 release 构建去找 staticlib 版的 std，
# 报出来的是 `found staticlib std instead of rlib`，跟真实原因隔着好几层。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 注意：不能写成 [target.'cfg(desktop)'.dependencies]。`desktop` 是 tauri-build 注入的
# 自定义 cfg，Cargo 的 target 选择器只认 target_os / target_arch 这类真 cfg，
# 写在那儿依赖根本不会被链接，而报错是「找不到 crate」，跟原因隔着好几层。
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

podapp-runtime = { path = "../../../crates/podapp-runtime" }
# 能力与宿主动作的唯一组装处。加能力只改那一个 crate，三个面同时拿到。
# qr / zip / cli 都经它进来，所以浮舱不再直接依赖它们 ——
# 留着直接依赖会让「改哪个 crate 会影响浮舱」看起来比实际更宽。
podapp-host = { path = "../../../crates/podapp-host" }
podapp-win = { path = "../../../crates/podapp-win" }
# 只读访问 Codex 会话：以宿主动作形式提供，程序舱沙箱碰不到 ~/.codex
podapp-codex = { path = "../../../crates/podapp-codex" }
# MCP 桥：浮舱只用它数一下「接上之后 AI 多了几件能做的事」，
# 真正的服务进程是随身带的 sidecar，不在这里跑。
podapp-mcp = { path = "../../../crates/podapp-mcp" }
# 工作流：把已装动作按顺序串起来。它不新增执行路径，只是按顺序调 headless::invoke。
podapp-flow = { path = "../../../crates/podapp-flow" }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
